[package]
name = "klm"
version = "0.1.1"
edition = "2024"
description = "reserved name"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dualys/klm.git"
[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "blake3/std",
]
alloc = ["serde/alloc", "serde_json/alloc"]

[dependencies]
kpack = "0.1.0"
jinshu = "0.1.0"
cubefs = "0.1.1"
noun = "0.1.0"
blake3 = { version = "1.5", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
justify = { version = "0.1.3", features = ["unicode-width"] }
inquire = { version = "0.9.4", features = ["console"] }
crossterm = "0.29.0"
