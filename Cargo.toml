[package]
name = "klm"
version = "0.2.0"
edition = "2024"
description = "reserved name"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dualys/klm.git"
[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "blake3/std",
    "dep:inquire",
    "dep:crossterm",
    "dep:clap",
    "dep:indicatif",
    "dep:chrono",
]
alloc = ["serde/alloc", "serde_json/alloc"]

[[bin]]
name = "klm"
path = "src/main.rs"
required-features = ["std"]

[dependencies]
kpack = "0.1.0"
jinshu = "0.1.0"
cubefs = "0.1.1"
noun = "0.1.0"
blake3 = { version = "1.5", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
inquire = { version = "0.9.4", features = ["console", "date", "editor"], optional = true }
crossterm = { version = "0.29.0", optional = true }
clap = { version = "4.6.7", optional = true }
indicatif = { version = "0.18.6", optional = true }
chrono = { version = "0.4.45", optional = true }
